[package]
name = "spotifier-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
librespot = "=0.8.0"
librespot-oauth = { version = "=0.8.0", features = ["native-tls"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
